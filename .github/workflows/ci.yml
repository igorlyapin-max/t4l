name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: t4l
          POSTGRES_USER: t4l
          POSTGRES_PASSWORD: t4l_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U t4l -d t4l"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: python3 scripts/validate-contract.py contracts/openapi.yaml
      - run: dotnet test T4L.slnx
        env:
          T4L_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=t4l;Username=t4l;Password=t4l_ci_only

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon
        working-directory: android-app

  container-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, android]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: t4l
          POSTGRES_USER: t4l
          POSTGRES_PASSWORD: t4l_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U t4l -d t4l"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        run: test "${GITHUB_REF_NAME}" = "v$(tr -d '\r\n' < VERSION)"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and verify immutable image
        run: ./scripts/build-verified-image.sh "ghcr.io/igorlyapin-max/t4l-api:${GITHUB_REF_NAME}"
        env:
          T4L_VERIFY_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=t4l;Username=t4l;Password=t4l_ci_only
      - name: Push immutable image tags
        run: |
          image="ghcr.io/igorlyapin-max/t4l-api:${GITHUB_REF_NAME}"
          revision="$(git rev-parse HEAD)"
          docker push "${image}"
          docker tag "${image}" "ghcr.io/igorlyapin-max/t4l-api:sha-${revision}"
          docker push "ghcr.io/igorlyapin-max/t4l-api:sha-${revision}"

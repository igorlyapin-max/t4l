openapi: 3.1.0
info:
  title: T4L API
  version: 2.0.0
  description: Canonical API for T4L clients. UUIDs are generated by clients and revisions by the server.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /bootstrap:
    get:
      operationId: getBootstrap
      responses:
        '200':
          description: Current actor and accessible workspaces
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bootstrap' }
  /workspaces/{workspaceId}/category-trees:
    get:
      operationId: listCategoryTrees
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Category trees visible in the workspace
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryTree' }
  /workspaces/{workspaceId}/reports/aggregate:
    get:
      operationId: aggregateReport
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Canonical category durations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AggregateRow' }
  /workspaces/{workspaceId}/reports/intersection:
    post:
      operationId: calculateIntersection
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntersectionRequest' }
      responses:
        '200':
          description: Duration where every selected timeline matches its category filter
          content:
            application/json:
              schema:
                type: object
                required: [durationSeconds]
                properties:
                  durationSeconds: { type: integer, format: int64, minimum: 0 }
  /workspaces/{workspaceId}/planner/recommendations:
    post:
      operationId: getPlannerRecommendations
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationRequest' }
      responses:
        '200':
          description: Deterministic task recommendations for the available window
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskRecommendation' }
  /sync/push:
    post:
      operationId: pushMutations
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushRequest' }
      responses:
        '200':
          description: Per-mutation outcome; retries with the same mutation ID are idempotent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushResponse' }
  /sync/changes:
    get:
      operationId: pullChanges
      parameters:
        - { name: workspaceId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, required: false, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        '200':
          description: Ordered delta page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangePage' }
  /sync/snapshot:
    get:
      operationId: getSnapshot
      parameters:
        - { name: workspaceId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Full replica snapshot for initial or expired-cursor sync
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSnapshot' }
  /imports:
    post:
      operationId: importWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, snapshot]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                snapshot: { $ref: '#/components/schemas/WorkspaceSnapshot' }
      responses:
        '200':
          description: Imported workspace with remapped IDs
          content:
            application/json:
              schema:
                type: object
                required: [workspaceId, importedEntities]
                properties:
                  workspaceId: { type: string, format: uuid }
                  importedEntities: { type: integer, minimum: 0 }
  /diagnostics/events:
    post:
      operationId: submitClientDiagnostics
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagnosticEventBatch' }
      responses:
        '202': { description: Diagnostic events accepted }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Bootstrap:
      type: object
      required: [userId, defaultWorkspaceId, workspaces]
      properties:
        userId: { type: string, format: uuid }
        defaultWorkspaceId: { type: string, format: uuid }
        workspaces:
          type: array
          items:
            type: object
            required: [workspaceId, name, role]
            properties:
              workspaceId: { type: string, format: uuid }
              name: { type: string }
              role: { type: string, enum: [owner, admin, editor, viewer] }
    SyncMetadata:
      type: object
      required: [id, workspaceId, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time }
    CategoryTree:
      allOf:
        - $ref: '#/components/schemas/SyncMetadata'
        - type: object
          required: [name, role, sortOrder, archived]
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            role: { type: string, enum: [standard, primary, secondary] }
            sortOrder: { type: integer }
            archived: { type: boolean }
    Category:
      allOf:
        - $ref: '#/components/schemas/SyncMetadata'
        - type: object
          required: [categoryTreeId, name, loadType, sortOrder, archived]
          properties:
            categoryTreeId: { type: string, format: uuid }
            parentId: { type: [string, 'null'], format: uuid }
            name: { type: string, minLength: 1, maxLength: 120 }
            loadType: { type: string, enum: [focus, light, background, compatible] }
            sortOrder: { type: integer }
            archived: { type: boolean }
    TimeEvent:
      allOf:
        - $ref: '#/components/schemas/SyncMetadata'
        - type: object
          required: [categoryTreeId, occurredAt, zoneId, source]
          properties:
            categoryTreeId: { type: string, format: uuid }
            categoryId: { type: [string, 'null'], format: uuid }
            taskId: { type: [string, 'null'], format: uuid }
            occurredAt: { type: string, format: date-time }
            zoneId: { type: string }
            source: { type: string, enum: [manual, import, integration] }
            note: { type: [string, 'null'], maxLength: 2000 }
    Task:
      allOf:
        - $ref: '#/components/schemas/SyncMetadata'
        - type: object
          required: [title, estimateMinutes, remainingEstimateMinutes, zoneId, value, energy, progress, status, splittable]
          properties:
            title: { type: string, minLength: 1, maxLength: 240 }
            categoryId: { type: [string, 'null'], format: uuid }
            parentTaskId: { type: [string, 'null'], format: uuid }
            estimateMinutes: { type: integer, minimum: 0 }
            remainingEstimateMinutes: { type: integer, minimum: 0 }
            deadline: { type: [string, 'null'], format: date-time }
            nextActionDate: { type: [string, 'null'], format: date }
            nextActionTime: { type: [string, 'null'], format: time }
            zoneId: { type: string }
            value: { type: integer, minimum: 0, maximum: 100 }
            energy: { type: string, enum: [low, medium, high] }
            progress: { type: integer, minimum: 0, maximum: 100 }
            status: { type: string, enum: [active, paused, completed, cancelled] }
            splittable: { type: boolean }
    TaskComment:
      allOf:
        - $ref: '#/components/schemas/SyncMetadata'
        - type: object
          required: [taskId, authorId, text]
          properties:
            taskId: { type: string, format: uuid }
            authorId: { type: string, format: uuid }
            text: { type: string, minLength: 1, maxLength: 4000 }
    Plan:
      allOf:
        - $ref: '#/components/schemas/SyncMetadata'
        - type: object
          required: [name, kind, startsAt, endsAt, zoneId, archived]
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            kind: { type: string, enum: [budget, timeline] }
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
            zoneId: { type: string }
            archived: { type: boolean }
    BudgetAllocation:
      allOf:
        - $ref: '#/components/schemas/SyncMetadata'
        - type: object
          required: [planId, categoryId, ownMinutes]
          properties:
            planId: { type: string, format: uuid }
            categoryId: { type: string, format: uuid }
            ownMinutes: { type: integer, minimum: 0 }
    PlannedEvent:
      allOf:
        - $ref: '#/components/schemas/SyncMetadata'
        - type: object
          required: [planId, categoryTreeId, occurredAt]
          properties:
            planId: { type: string, format: uuid }
            categoryTreeId: { type: string, format: uuid }
            categoryId: { type: [string, 'null'], format: uuid }
            taskId: { type: [string, 'null'], format: uuid }
            occurredAt: { type: string, format: date-time }
            note: { type: [string, 'null'], maxLength: 2000 }
    Mutation:
      type: object
      required: [clientMutationId, workspaceId, entityType, entityId, operation, baseRevision, payload]
      properties:
        clientMutationId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        entityType: { type: string, enum: [categoryTree, category, event, task, taskComment, plan, budgetAllocation, plannedEvent] }
        entityId: { type: string, format: uuid }
        operation: { type: string, enum: [upsert, delete] }
        baseRevision: { type: integer, format: int64, minimum: 0 }
        payload: { type: object, additionalProperties: true }
    PushRequest:
      type: object
      required: [clientId, mutations]
      properties:
        clientId: { type: string, format: uuid }
        mutations:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/Mutation' }
    MutationResult:
      type: object
      required: [clientMutationId, status, duplicate]
      properties:
        clientMutationId: { type: string, format: uuid }
        status: { type: string, enum: [applied, conflict, rejected] }
        revision: { type: [integer, 'null'], format: int64 }
        serverEntity: { type: [object, 'null'], additionalProperties: true }
        errorCode: { type: [string, 'null'] }
        canonicalEntityId: { type: [string, 'null'], format: uuid }
        duplicate: { type: boolean }
    DiagnosticEventBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [timestamp, level, eventName, attributes, clientId, appVersion]
            properties:
              timestamp: { type: string, format: date-time }
              level: { type: string }
              eventName: { type: string, maxLength: 80 }
              attributes: { type: object, additionalProperties: { type: string } }
              clientId: { type: string, format: uuid }
              appVersion: { type: string, maxLength: 40 }
    PushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/MutationResult' }
    Change:
      type: object
      required: [sequence, entityType, entityId, revision, deleted, payload]
      properties:
        sequence: { type: integer, format: int64 }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        revision: { type: integer, format: int64 }
        deleted: { type: boolean }
        payload: { type: object, additionalProperties: true }
    ChangePage:
      type: object
      required: [changes, nextCursor, hasMore]
      properties:
        changes: { type: array, items: { $ref: '#/components/schemas/Change' } }
        nextCursor: { type: integer, format: int64 }
        hasMore: { type: boolean }
    WorkspaceSnapshot:
      type: object
      required: [formatVersion, exportedAt, workspaceId, cursor, categoryTrees, categories, events, tasks, taskComments, plans, budgetAllocations, plannedEvents]
      properties:
        formatVersion: { type: integer, const: 2 }
        exportedAt: { type: string, format: date-time }
        workspaceId: { type: string, format: uuid }
        cursor: { type: integer, format: int64 }
        categoryTrees: { type: array, items: { $ref: '#/components/schemas/CategoryTree' } }
        categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
        events: { type: array, items: { $ref: '#/components/schemas/TimeEvent' } }
        tasks: { type: array, items: { $ref: '#/components/schemas/Task' } }
        taskComments: { type: array, items: { $ref: '#/components/schemas/TaskComment' } }
        plans: { type: array, items: { $ref: '#/components/schemas/Plan' } }
        budgetAllocations: { type: array, items: { $ref: '#/components/schemas/BudgetAllocation' } }
        plannedEvents: { type: array, items: { $ref: '#/components/schemas/PlannedEvent' } }
    AggregateRow:
      type: object
      required: [categoryTreeId, categoryId, durationSeconds]
      properties:
        categoryTreeId: { type: string, format: uuid }
        categoryId: { type: [string, 'null'], format: uuid }
        durationSeconds: { type: integer, format: int64, minimum: 0 }
    IntersectionFilter:
      type: object
      required: [categoryTreeId, categoryIds]
      properties:
        categoryTreeId: { type: string, format: uuid }
        categoryIds:
          type: array
          minItems: 1
          items: { type: [string, 'null'], format: uuid }
    IntersectionRequest:
      type: object
      required: [from, to, filters]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        filters:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/IntersectionFilter' }
    RecommendationRequest:
      type: object
      required: [windowMinutes, energy]
      properties:
        windowMinutes: { type: integer, minimum: 1 }
        energy: { type: string, enum: [low, medium, high] }
        planningFactor: { type: number, exclusiveMinimum: 0, default: 1 }
    TaskRecommendation:
      type: object
      required: [taskId, suggestedMinutes, score]
      properties:
        taskId: { type: string, format: uuid }
        suggestedMinutes: { type: integer, minimum: 1 }
        score: { type: number }
